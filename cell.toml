# One repo = one cell = one function. Key metadata rows for the control room's Keys panel.
[cell]
api = "cr.keys"
crate = "cr-keys"
# majors served: 2 (live) and 1 (frozen, crates/cr-keys-api/src/versions/v1.rs)
args = ["serve"]
kind = "function"

# Cells this one calls, as <api>@<major>; none is started by it (a view cell reports a missing source, it does not need it to start).
depends_on = []

[launch]
health = "HealthOp"
start_timeout_ms = 5000
restart_backoff_ms = [1000, 300000]

[placement]
# where it runs is the deploy's placement table (repo:control-room docs/DESIGN.md section 11), not this file

[limits]
disk_bytes = "128M"

[stamp]
id = "cell:cr.keys"
kind = "cell"
path = "cell.toml"
updated_at = 2026-11-15T22:05:51Z
version = "0.5"
access = "public"
canonical_of = []
duplicate_of = ""
owner = "foreman/lead"
source_of_truth = "https://github.com/ce-net/cr-keys"
stale_after = 180
